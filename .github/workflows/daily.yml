name: Daily Japanese Reading Mail

on:
  schedule:
    # 평일(월~금) 20:00 KST (UTC 11:00, 같은 날짜 — 자정을 넘지 않으므로 요일이 밀리지 않음)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      category:
        description: "카테고리 강제 지정 (비우면 요일에 따라 자동 선택)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - 부사
          - 인용
          - 강조·역접
          - 비즈니스
          - N1문어체
      mail_to:
        description: "수동 실행 시 단일 수신자 (비우면 EMAIL_RECIPIENTS 사용)"
        required: false
        default: ""

permissions:
  contents: write   # 쿨다운 이력 파일(used_history.json)을 자동 커밋하기 위해 필요

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # 이력 커밋을 위해 기본 토큰 자격 증명을 유지

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          MANUAL_MAIL_TO: ${{ github.event.inputs.mail_to }}
          FORCE_CATEGORY: ${{ github.event.inputs.category }}
          # 선택 기능 스위치(저장소 Variables에서 설정, 비워 두면 off). 계획: docs/plans/
          EVIDENCE_MODE: ${{ vars.EVIDENCE_MODE || 'shadow' }}   # off | shadow (기록 전용, 번복 없음). 비우면 shadow, 끄려면 Variables에 off
          USAGE_HINT_MODE: ${{ vars.USAGE_HINT_MODE }}    # off | examples (사람이 확인한 용례만)
        run: python get_grammar.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-output
          path: |
            JPN_*.pdf
            run_log.txt
          if-no-files-found: ignore
          retention-days: 7
