name: Daily Japanese Grammar Mail

on:
  schedule:
    # 매일 07:00 KST (UTC 22:00 전날)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "테마 강제 지정 (비우면 요일에 따라 자동 선택)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - conjugation
          - transitivity
          - giving
          - voice
          - conditional
          - compound
          - keigo
      mail_to:
        description: "수동 실행 시 단일 수신자 (비우면 EMAIL_RECIPIENTS 사용)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Japanese/Korean font
        # PDF에 일본어와 한국어가 함께 들어가므로 두 문자를 모두 포함한 Noto CJK 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          MANUAL_MAIL_TO: ${{ github.event.inputs.mail_to }}
          FORCE_THEME: ${{ github.event.inputs.theme }}
        run: python get_grammar.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-output
          path: |
            JPN_GRAMMAR.pdf
            run_log.txt
          if-no-files-found: ignore
          retention-days: 7
