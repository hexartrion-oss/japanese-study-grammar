name: Grounding Probe (one-off)

# 단계 0 실측용 일회성 워크플로. 메일 발송·저장소 쓰기 없음(contents: read).
# workflow_dispatch는 기본 브랜치에 파일이 있어야 목록에 뜨므로, 이 브랜치에서
# 프로브 파일이 바뀌었을 때만 push로도 실행되게 했다. 실측이 끝나면 삭제한다.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/get-grammar-kanji-normalization-pf1syf
    paths:
      - ".github/workflows/grounding_probe.yml"
      - "scripts/grounding_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "google-genai>=1.0.0"

      - name: Run probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROBE_REPEAT: "2"
        run: python scripts/grounding_probe.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-probe
          path: probe_results.jsonl
          if-no-files-found: ignore
          retention-days: 7
